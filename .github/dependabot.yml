version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "deps" }
  # npm for /frontend is added when frontend/package.json exists (M3).
