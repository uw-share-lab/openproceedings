name: nightly
# Every property test at 50,000 examples, the exhaustive tokenizer check, and the full mutation run of every
# gate and tooling check (make mutate). Reviews run only `make mutate-changed`; this catches anything that
# slipped. Differential@50k and full-corpus parity join this job with the Tantivy engine (task-057).
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # Three parallel jobs, each with its own limit (M1 gate: one 120-minute job was too tight on CI runners).
  # Locally the oracle-backed properties take ~35 min at 50k examples and the rest ~20; CI is ~1.5-2x slower.
  properties-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync workspace
        run: uv sync --locked
      - name: Oracle-backed properties at 50,000 examples
        run: uv run --locked pytest -q --hypothesis-profile=nightly backend/tests/unit/test_properties.py backend/tests/golden/test_reference_200.py
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync workspace
        run: uv sync --locked
      - name: Exhaustive tokenizer check (every Unicode code point, 8 contexts)
        run: OP_EXHAUSTIVE=1 uv run --locked pytest -q backend/tests/unit/test_normalize_exhaustive.py
      - name: Every other property at 50,000 examples
        run: >-
          uv run --locked pytest -q --hypothesis-profile=nightly -k "not exhaustive"
          --ignore=backend/tests/unit/test_properties.py --ignore=backend/tests/golden/test_reference_200.py
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync workspace
        run: uv sync --locked
      - name: make mutate (every mutant must be killed, or documented as equivalent)
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          make mutate
