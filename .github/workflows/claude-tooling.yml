name: claude-tooling
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  merge_group:  # the merge queue's builds must report this required check too (decision-027)
    types: [checks_requested]
permissions:
  contents: read

jobs:
  claude-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.13.5" } # deploy/api.Dockerfile's uv; make tooling checks it (TASK-252)
      - name: Sync workspace (the autofix rows run ruff from .venv)
        run: uv sync --locked
      - name: make tooling (roster lint, roster + learnings indexes, backlog hygiene, digest pins, file modes, uv pin, npm specs, probes, case tables)
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          make tooling
