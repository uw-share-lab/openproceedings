name: lint
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell hooks parse
        run: for f in .claude/hooks/*.sh .claude/hooks/tests/*.sh .githooks/* scripts/*.sh; do bash -n "$f"; done
      - uses: astral-sh/setup-uv@v6
        if: hashFiles('backend/pyproject.toml') != ''
      - name: Backend — ruff, format, mypy
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          uv sync --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy --strict src
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with: { node-version: 22 }
      - name: Frontend — eslint, tsc, prettier
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npx prettier --check .
