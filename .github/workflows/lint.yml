name: lint
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('frontend/package.json') != ''
        with: { node-version: 22 }
      - name: Install shellcheck and actionlint (pinned release, checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "${ACTIONLINT_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" actionlint
      - name: Sync workspace (ruff, mypy)
        run: |
          uv sync --locked
          if [ -f frontend/package.json ]; then (cd frontend && npm ci); fi
      - name: make lint (same target as the pre-push hook)
        run: make lint
      - name: actionlint
        run: ./actionlint -color
