name: lint
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  merge_group:  # the merge queue's builds must report this required check too (decision-027)
    types: [checks_requested]
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.13.0" } # deploy/api.Dockerfile's uv; make tooling checks it (TASK-252)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('frontend/package.json') != ''
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: package-lock.json }
      - name: Install shellcheck and actionlint (pinned release, checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "${ACTIONLINT_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" actionlint
      - name: Sync workspaces (uv for ruff and mypy, npm for prettier, eslint and tsc)
        run: |
          uv sync --locked
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; fi
      - name: make lint (same target as the pre-push hook)
        run: make lint
      - name: actionlint
        run: ./actionlint -color
