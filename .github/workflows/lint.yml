name: lint
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('frontend/package.json') != ''
        with: { node-version: 22 }
      - name: Install shellcheck and actionlint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: Sync workspace (ruff, mypy)
        run: |
          uv sync --frozen
          if [ -f frontend/package.json ]; then (cd frontend && npm ci); fi
      - name: make lint (same target as the pre-push hook)
        run: make lint
      - name: actionlint
        run: ./actionlint -color
