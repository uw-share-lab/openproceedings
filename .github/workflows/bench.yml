name: bench
# Spec 03 budgets on the fixture index (backend/tests/bench, pytest-benchmark; spec 07 §E; task-031). The
# pull request's base and head run on the same runner, one after the other; a minimum time more than 20%
# slower than the base fails (the minimum is the statistic least moved by runner noise), and every
# benchmark asserts its budget. A base without the suite only records.
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Benchmarks on the base
        run: |
          git checkout --quiet "$BASE"
          if [ -f backend/tests/bench/test_bench.py ]; then
            uv sync --locked
            uv run --locked pytest -q backend/tests/bench --benchmark-enable --benchmark-only --benchmark-save=base
          fi
      - name: Benchmarks on the head, against the base
        run: |
          git checkout --quiet "$HEAD"
          uv sync --locked
          if ls .benchmarks/*/*_base.json >/dev/null 2>&1; then
            uv run --locked pytest -q backend/tests/bench --benchmark-enable --benchmark-only \
              --benchmark-compare --benchmark-compare-fail=min:20%
          else
            uv run --locked pytest -q backend/tests/bench --benchmark-enable --benchmark-only
          fi
