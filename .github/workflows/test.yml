name: test
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # the suite is ~2.5 min locally plus the differential at 2,000 (~5 min)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: hashFiles('backend/pyproject.toml') != ''
      - name: Backend — unit, golden, differential (2k), contract
        if: hashFiles('backend/pyproject.toml') != ''
        run: |
          uv sync --locked
          uv run --locked pytest -q --hypothesis-profile=ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('frontend/package.json') != ''
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: package-lock.json }
      - name: Install the npm workspace (root package-lock.json)
        if: hashFiles('frontend/package.json') != ''
        run: npm ci
      - name: OpenAPI → TS types are fresh
        # Arms itself once TASK-040 commits the generated schema.ts and the gen:api script.
        if: hashFiles('backend/pyproject.toml') != '' && hashFiles('frontend/src/api/schema.ts') != ''
        run: |
          uv run --locked op openapi > frontend/openapi.json
          (cd frontend && npm run gen:api && git diff --exit-code src/api/schema.ts)
      - name: Frontend — vitest
        if: hashFiles('frontend/package.json') != ''
        run: npm test --workspace frontend
      - name: Frontend — production build (output standalone)
        if: hashFiles('frontend/package.json') != ''
        env: { NEXT_TELEMETRY_DISABLED: "1" }
        run: |
          npm run build --workspace frontend
          test -f frontend/.next/standalone/frontend/server.js
