name: test
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: hashFiles('backend/pyproject.toml') != ''
      - name: Backend — unit, golden, differential (2k), contract
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: |
          uv sync --dev
          uv run pytest -q --hypothesis-profile=ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('frontend/package.json') != ''
        with: { node-version: 22 }
      - name: OpenAPI → TS types are fresh
        if: hashFiles('backend/pyproject.toml') != '' && hashFiles('frontend/package.json') != ''
        run: |
          (cd backend && uv run op openapi > ../frontend/openapi.json)
          (cd frontend && npm ci && npm run gen:api && git diff --exit-code src/api/schema.ts)
      - name: Frontend — vitest
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
