# Official ICML pages with per-paper abstracts, 1988-2012 (spec 01 §Sources, ICML sites row; decision-047;
# TASK-206). Data, not code: `ingest/sources/icml_sites.py` loads and checks it. The survey behind every row,
# and the years with no surviving page (1988-1996, 1999, 2000, 2002, 2005, 2006; 1997 and 1998 have only
# submission abstracts with contact details, not used), is docs/research/2026-10-06-icml-pre-2013-abstract-sources.md.
#
# [[page]] one page: year; url (what is fetched: a live icml.cc page, or an Internet Archive capture pinned to
#          its exact timestamp, https://web.archive.org/web/<14 digits>id_/<official>); official (the page the
#          capture is of, as the archive holds it); parser (icml_sites.PARSERS); charset (the servers send bare
#          text/html); entries (what the parser read off it when verified; a different count stops the crawl);
#          verified; note.
# Allowed: official ICML / IMLS conference pages only. Never ACM DL, Scholar, Semantic Scholar, author pages, arXiv.

