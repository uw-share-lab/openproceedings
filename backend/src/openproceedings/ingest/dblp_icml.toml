# The dblp table (spec 01 §Sources, dblp row; decision-047; TASK-205). Data, not code: `ingest/dblp_table.py`
# loads and checks it, and `ingest/sources/dblp.py` reads ICML 1988-2012 through it.
#
# dblp.org forbids crawling (robots.txt `Disallow: /`; its pages and API sit behind a bot challenge), so the
# only dblp input is one monthly snapshot XML release from Dagstuhl DROPS (CC0, a DOI per release), pinned here
# by DOI, URL, size and sha256 with the DTD that defines its entities. Moving to a newer release is a change to
# this file (and a snapshot-diff event): re-verify every year's `papers` against it.
#
# [[year]]      one ICML year: its main conference's dblp proceedings key(s), the inproceedings the pinned
#               release lists under them, the proceedings' title as dblp gives it, when and where it was checked
# [[excluded]]  every other `conf/icml/` proceedings key dblp dates 1988-2012 (workshops held at ICML), with why
#               it is not the main conference. A key in neither list stops the ingest: a person classifies it.

