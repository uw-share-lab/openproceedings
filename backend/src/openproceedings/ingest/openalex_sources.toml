# OpenAlex listing table (AAAI 1980-2008, the DOI-less dblp years; decision-049, milestone C). Data, not code:
# `ingest/openalex_table.py` loads and checks it, and no other module holds an OpenAlex source id. The rows are the
# live census of 2026-10-10 (scripts/openalex_census.py; docs/research/2026-10-09-aaai-aies-facct-iaseai-sources.md
# §OpenAlex): OpenAlex files AAAI 1980-2008 under one source, S4306420577 "National Conference on Artificial
# Intelligence", which holds works in every held year (works for about 20-50% of each year's dblp records), so
# every held year has a row and no year stays unlisted. The source also holds other works (proceedings volumes,
# symposium and other-venue papers, OCR-garbled titles): matching is one-to-one by exact title key, so those stay
# unmatched. Its works in the not-held years 1989, 1995, 2001 and 2003 get no row (the table refuses those years).
#
# [[listing]] columns (one per venue and year)
#   venue        AAAI (AIES and FAccT records carry DOIs: the DOI route reaches them)
#   year         a held year of record.DBLP_YEARS["AAAI"] (1980-2008)
#   source_ids   the OpenAlex source ids (`S…`) under which OpenAlex files that year's proceedings (per era)
#   works        the works OpenAlex listed for the row when verified; a crawl that finds another count stops
#   verified     the date the row was checked live
#   source       where the check is recorded
#
# [[duplicate_choice]] columns (TASK-231, owner ruling 2026-10-10): a cited, hand-checked exception to the DOI
# route's `doi_duplicate` refusal, for a DOI OpenAlex answers with several works whose texts differ. The fill
# attaches `work` alone (counted `attached_doi` and `duplicate_chosen`), and stops (`duplicate_choice_unmatched`)
# if the extract answers the DOI without `work` among two or more works.
#   doi          the bare, lower-case DOI
#   work         the OpenAlex work id (`W…`) attached for it
#   reason       why that work, not the other
#   verified     the date the texts were compared
#   source       where the comparison and the ruling are recorded

