notes = "Verified on a new schema-4 index of the 173,253-paper snapshot of 2026-10-11: AAAI (1980+), AIES, FAccT and IASEAI join the corpus (decision-049), 4,536 AAAI 1980-2008 papers gain AAAI's own abstracts from archived aaai.org pages (decision-051) and 1,117 gain labelled OpenAlex abstracts (abstract_kind:openalex). Default searches shrank where AAAI 1980-2008 and AIES 2018-2023 entries outside the technical program took their own tracks (decision-050: 1,197 track changes, 39 not-paper removals), so a search record saved on an earlier index replays as drifted, naming each removed paper's cause. Index schema 2 is retired; schema-3 indexes stay replayable. Promotion does not deploy data; because SCHEMA_VERSION changes, deploying this release needs index b4f335e07e70 with it (spec 08 §Release step 9)."

