# Cause notes for coverage cells that miss the M4 gate (spec 07 §C, coverage-reporting skill), read by
# `op eval coverage`. One table per cell, keyed "<Venue> <year> <track>", with a `cause`: the classification
# (source definition, classification, dedup or crawl gap). Never adjust an official number to fit.
#
# An owner-accepted exception is an optional `accepted` table under the cell. It passes the cell only while
# the cell's indexed and official counts are exactly `indexed` and `official` and `papers` are the gap (as many
# as it, each in the snapshot, outside the cell for an under-count); anything else fails the cell again. Every
# key is required and no other key is allowed: indexed, official, reason, papers (record ids), accepted_by
# ("project owner"), accepted_on (a date), decision (the decision record, which must exist). No string may
# hold a control character (a newline included).

["ICLR 2013 main"]
cause = "source definition: ICLR's 2013 conference list has 24 papers, but OpenReview decides one of them (Factorized Topic Models) as a workshop poster, so 23 are indexed as main"

["ICLR 2013 main".accepted]
