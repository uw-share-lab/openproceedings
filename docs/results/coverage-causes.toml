official = 24
reason = "Factorized Topic Models is on ICLR's official 2013 conference list, but its OpenReview decision is conferencePoster-iclr2013-workshop; the record keeps OpenReview's decision (track:workshop)."
papers = ["op:iclr:2013:11y_SldoumvZl"]
accepted_by = "project owner"
accepted_on = 2026-09-29
decision = "decision-016"
