# Root of the openproceedings monorepo: a uv workspace plus repo-wide tool config.
# Python packages live in workspace members (backend/ joins in M1; later packages such as a separate
# eval/ can join the same way) and share one uv.lock. The frontend is an npm workspace (frontend/).
[project]
name = "openproceedings-monorepo"
version = "0.0.0"
requires-python = ">=3.12"
description = "Workspace root (not a package): dev tooling shared across the monorepo."
dependencies = ["openproceedings"]

[tool.uv]
package = false
# Pin the build backend so building the wheel is reproducible (hatchling is fetched at build time).
build-constraint-dependencies = ["hatchling==1.27.0"]

[tool.uv.sources]
openproceedings = { workspace = true }

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = ["ruff>=0.13", "mypy>=1.18", "pytest>=8.3", "hypothesis>=6.112"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data", "frontend", "backlog"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends/Query in argument defaults is intentional
    "RUF001",  # ambiguous-unicode in strings: our docs and messages use → and – on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "backend/src"
