# openproceedings behind Caddy: `api` (op serve), `web` (the Next.js standalone server) and `caddy` (TLS and the
# timeouts, body cap and log filters spec 08 §Deploy requires). Host-agnostic: nothing here names a host or a
# provider (TASK-064 decides the hosting). The runbook is deploy/README.md. Run from the repository root:
#
#   OP_DATA_HOST=/srv/openproceedings/data OP_INSTANCE=private docker compose -f deploy/compose.yml up -d --build
#
# Settings (environment, or an `.env` file beside this one; deploy/README.md §Settings):
#   OP_DATA_HOST          required: the host's data directory, holding indexes/ (with `current`), snapshots/,
#                         records/ (0700, owned by uid 10001) and takedowns/withheld.txt (and nothing else in
#                         takedowns/: the log lives elsewhere)
#   OP_INSTANCE           required: public | private (the web image's build gate; public needs a contact)
#   OP_TAKEDOWN_CONTACT   the takedown contact, compiled into the web image (required when public)
#   OP_DOMAIN             the site's name (default localhost: Caddy's local CA; a real name: ACME)
#   OP_HSTS               the Strict-Transport-Security value (default max-age=63072000; deploy/Caddyfile)
#   OP_HTTP_PORT, OP_HTTPS_PORT  the host ports (default 80 and 443)
#   OP_INTERNAL_SUBNET, OP_INTERNAL_IP_RANGE, OP_PROXY_ADDRESS  the internal network, the part of it api and
#                         web are given addresses from, and Caddy's fixed address outside that part (defaults
#                         172.30.80.0/24, 172.30.80.128/25 and 172.30.80.2): the one address the API believes
#                         X-Forwarded-For from
#   OP_IMAGE_TAG          the tag of the three images built here (default local); smoke-test.sh uses its own
#
# Needs Docker Engine 26.0.0 or later (or 25.0.4 / 23.0.11): before those, the embedded DNS forwarded lookups
# from an `internal` network to outside resolvers (CVE-2024-29018), a way out of the no-egress network below.
name: openproceedings

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  init: true # tini as PID 1: it forwards signals (SIGHUP reloads the API) and reaps children

services:
  api:
    <<: *hardened
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: openproceedings-api:${OP_IMAGE_TAG:-local}
    # neither root nor the operator's account: the image's op-api (uid and gid 10001; TASK-065 AC #3)
    user: "10001:10001"
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --trusted-proxy
      - ${OP_PROXY_ADDRESS:-172.30.80.2}
    volumes:
      # Tantivy takes a lock file inside an index directory to open it, so this mount can't be `:ro`. The
      # runbook makes each version directory 0750 with group op-api and only its two .tantivy-*.lock files
      # group-writable: the API can open an index and change nothing else (deploy/README.md §Permissions)
      - ${OP_DATA_HOST:?set OP_DATA_HOST to the data directory}/indexes:/data/indexes
      - ${OP_DATA_HOST}/snapshots:/data/snapshots:ro # /papers provenance and the takedown merges
      # a directory holding only withheld.txt, never the takedown log, and never the file alone (an editor
      # that saves by rename would leave the container reading the old list across SIGHUP; TASK-065 AC #3)
      - ${OP_DATA_HOST}/takedowns:/data/takedowns:ro
      # search records, the API's one writable place: a host directory (0700, uid 10001), not a named volume,
      # so it sits in the data directory as spec 08 lays it out, and `op index retire` run on the host as the
      # operator can't read it and refuses (`records_unreadable`) rather than counting no pins in an absent
      # store. It is the only copy of every saved search: back it up (deploy/README.md §Backups)
      - type: bind
        source: ${OP_DATA_HOST}/records
        target: /data/records
        bind:
          create_host_path: false # never a root-owned directory the API can't write
    tmpfs:
      - /tmp
    networks:
      internal: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; b = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3).read(); sys.exit(0 if b'\"index_loaded\":true' in b else 1)"
      interval: 30s
      timeout: 5s
      start_period: 120s # the first load re-hashes every index file

  web:
    <<: *hardened
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        OPENPROCEEDINGS_INSTANCE: ${OP_INSTANCE:?set OP_INSTANCE to public or private}
        NEXT_PUBLIC_TAKEDOWN_CONTACT: ${OP_TAKEDOWN_CONTACT:-}
        NEXT_PUBLIC_API_BASE_URL: "" # the API is on the web app's own origin, behind Caddy
    image: openproceedings-web:${OP_IMAGE_TAG:-local}
    tmpfs:
      - /tmp
      - /app/frontend/.next/cache:uid=1000,gid=1000,mode=0700
    networks:
      internal: {}

  caddy:
    <<: *hardened
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
    image: openproceedings-caddy:${OP_IMAGE_TAG:-local}
    environment:
      OP_DOMAIN: ${OP_DOMAIN:-localhost}
      OP_HSTS: ${OP_HSTS:-max-age=63072000}
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0 # bind 80 and 443 as the image's unprivileged user
    ports:
      - ${OP_HTTP_PORT:-80}:80
      - ${OP_HTTPS_PORT:-443}:443
      - ${OP_HTTPS_PORT:-443}:443/udp
    volumes:
      - caddy-data:/data # certificates, ACME account and the local CA: keep across restarts
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks:
      internal:
        ipv4_address: ${OP_PROXY_ADDRESS:-172.30.80.2}
      edge: {}
    depends_on:
      - api
      - web

  # One-off operator commands that need the record store and write access to indexes/ (`op index retire`):
  # `docker compose -f deploy/compose.yml run --rm ops index retire <index_version>`. Never started by `up`.
  # It runs as root so it can remove an index directory the operator's account owns. Never run retire on the
  # host instead: there the record store is the API's and unreadable, so it refuses. The record store is
  # mounted read-write: SQLite opens even a read-only connection's -shm and -wal files for writing, and a
  # read-only mount makes it refuse the store (retire then refuses, `records_unreadable`). CHOWN is kept
  # because SQLite, running as root, gives each -shm or -wal file it creates the database file's owner
  # (op-api); without it they stay root's and the API can no longer open its store (checked, TASK-065).
  ops:
    image: openproceedings-api:${OP_IMAGE_TAG:-local}
    pull_policy: never # a local build only, never a registry image of the same name
    profiles: [ops]
    user: "0:0"
    read_only: true
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER] # root's file access over directories other accounts own
    volumes:
      - ${OP_DATA_HOST:?set OP_DATA_HOST to the data directory}/indexes:/data/indexes
      - ${OP_DATA_HOST}/snapshots:/data/snapshots:ro
      - type: bind
        source: ${OP_DATA_HOST}/records
        target: /data/records
        bind:
          create_host_path: false
    tmpfs:
      - /tmp

  # `op takedown check` against the API itself (http://api:8000, on the internal network; never through the
  # proxy), as the operator's account, which owns the takedown log (spec 08 §Deploy; deploy/README.md
  # §Takedowns). The log is read from OP_TAKEDOWN_LOG_HOST, a directory outside the data directory that the
  # api never mounts. Run it with the operator's uid and gid, so the log's owner check passes:
  #   docker compose -f deploy/compose.yml run --rm --user "$(id -u):$(id -g)" takedown-check
  takedown-check:
    image: openproceedings-api:${OP_IMAGE_TAG:-local}
    pull_policy: never
    profiles: [ops]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command:
      - takedown
      - check
      - --api
      - http://api:8000
      - --log
      - /takedown-log/log.jsonl
    volumes:
      - ${OP_DATA_HOST:?set OP_DATA_HOST to the data directory}/snapshots:/data/snapshots:ro # merges.csv
      - ${OP_DATA_HOST}/takedowns:/data/takedowns:ro
      - type: bind
        source: ${OP_TAKEDOWN_LOG_HOST:-/nonexistent/set-OP_TAKEDOWN_LOG_HOST}
        target: /takedown-log
        read_only: true
        bind:
          create_host_path: false # an unset or mistyped OP_TAKEDOWN_LOG_HOST fails the run
    tmpfs:
      - /tmp
    networks:
      internal: {}

networks:
  # api, web and caddy only: no route out, so neither the API nor the web server can reach the internet
  internal:
    internal: true
    ipam:
      config:
        - subnet: ${OP_INTERNAL_SUBNET:-172.30.80.0/24}
          # where api and web get their addresses: the upper half, so neither can take Caddy's fixed one
          ip_range: ${OP_INTERNAL_IP_RANGE:-172.30.80.128/25}
  edge: {} # caddy's published ports and its ACME requests

volumes:
  caddy-data:
  caddy-config:
